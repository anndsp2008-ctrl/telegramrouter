name: Smart formatting isolated checks
on:
  pull_request:
    paths:
      - 'app/SmartFormatting.php'
      - 'app/VipCardRenderer.php'
      - 'app/ContingencyCardRenderer.php'
      - 'tests/contingency-card-smoke.php'
      - 'tests/multiple-bet-contingency-smoke.php'
      - 'runtime-smart-format.php'
      - 'runtime-ui-labels.php'
      - 'tests/sidebar-no-flash-nav-test.php'
      - 'tests/sidebar-canonical-icon-parity.php'
      - 'tests/sidebar-shell-guard.test.cjs'
      - 'runtime-ai-learning.php'
      - 'app/AiLearningMemory.php'
      - 'runtime-workers-ai.php'
      - 'runtime-integrations-ui.php'
      - 'runtime-mobile-bottom-nav.php'
      - 'assets/brand/mobile-bottom-navigation.css'
      - 'tests/mobile-bottom-nav-visibility.php'
      - 'tests/reset-mobile-bottom-nav-parity.php'
      - 'assets/brand/integrations-v10.js'
      - 'tests/integrations-sidebar-no-flash.test.cjs'
      - 'app/WorkersAITranslation.php'
      - 'app/workers-ai-card.php'
      - 'scripts/workers-ai-request.php'
      - 'scripts/smart-workers-isolated.php'
      - 'scripts/smart-gemini-isolated.php'
      - 'scripts/translation-v2-safe-start.php'
      - 'scripts/google-cloud-safe-start.php'
      - 'tests/smart-provider-routing-smoke.php'
      - 'tests/workers-ai-model-smoke.php'
      - 'assets/brand/workers-ai-provider.css'
      - 'assets/brand/integrations-v10.css'
      - 'assets/brand/mobile-visual-audit.css'
      - 'assets/brand/activity-status-badges.css'
      - 'runtime-brand.php'
      - 'tests/login-logo-cache-smoke.php'
      - 'reset.php'
      - 'tests/reset-header-parity.php'
      - 'index.php'
      - 'tests/integration-badge-alignment-smoke.php'
      - 'tests/ai-learning-menu-order.php'
      - 'tests/smart-format-smoke.php'
      - '.github/workflows/smart-format-checks.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP extensions and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-mbstring php-gd fonts-dejavu-core
      - name: Lint standalone modules
        run: |
          php -l index.php
          php -l reset.php
          php -l runtime-brand.php
          php -l tests/login-logo-cache-smoke.php
          php -l tests/reset-header-parity.php
          php -l runtime-ui-labels.php
          php -l tests/sidebar-no-flash-nav-test.php
          php tests/sidebar-no-flash-nav-test.php
          php -l tests/sidebar-canonical-icon-parity.php
          php tests/sidebar-canonical-icon-parity.php
          node --check tests/sidebar-shell-guard.test.cjs
          node tests/sidebar-shell-guard.test.cjs
          node --check assets/brand/integrations-v10.js
          node --check tests/integrations-sidebar-no-flash.test.cjs
          node tests/integrations-sidebar-no-flash.test.cjs
          php -l tests/ai-learning-menu-order.php
          php tests/ai-learning-menu-order.php index.php
          php -l app/SmartFormatting.php
          php -l app/PurePngVipCardRenderer.php
          php -l app/VipCardRenderer.php
          php -l app/ContingencyCardRenderer.php
          php -l tests/contingency-card-smoke.php
          php -l tests/multiple-bet-contingency-smoke.php
          php -l runtime-smart-format.php
          php -l runtime-ai-learning.php
          php -l runtime-workers-ai.php
          php -l runtime-integrations-ui.php
          php -l runtime-mobile-bottom-nav.php
          php -l tests/mobile-bottom-nav-visibility.php
          php -l tests/reset-mobile-bottom-nav-parity.php
          php -l app/WorkersAITranslation.php
          php -l app/workers-ai-card.php
          php -l scripts/workers-ai-request.php
          php -l scripts/smart-workers-isolated.php
          php -l scripts/smart-gemini-isolated.php
          php -l scripts/translation-v2-safe-start.php
          php -l scripts/google-cloud-safe-start.php
          php -l tests/smart-provider-routing-smoke.php
          php -l tests/workers-ai-model-smoke.php
          php -l tests/integration-badge-alignment-smoke.php
      - name: Reconstruct sanitized baseline and patch it offline
        run: |
          mkdir -p /tmp/tmr-smart-fixture
          cat backup/production-source-2026-09-18.part*.b64 | tr -d '\r\n' | base64 -d | tar -xz -C /tmp/tmr-smart-fixture
          cp runtime-smart-format.php /tmp/tmr-smart-fixture/runtime-smart-format.php
          cp runtime-ai-learning.php /tmp/tmr-smart-fixture/runtime-ai-learning.php
          cp app/AiLearningMemory.php /tmp/tmr-smart-fixture/app/AiLearningMemory.php
          git fetch --no-tags --depth=1 origin b7ec9127df752e94450e25b2e333c4fe76cd060b
          git show FETCH_HEAD:app/SmartFormatting.php > /tmp/tmr-smart-fixture/app/SmartFormatting.php
          test -s /tmp/tmr-smart-fixture/app/SmartFormatting.php
          cp runtime-workers-ai.php /tmp/tmr-smart-fixture/runtime-workers-ai.php
          cp runtime-brand.php /tmp/tmr-smart-fixture/runtime-brand.php
          cp runtime-mobile-bottom-nav.php /tmp/tmr-smart-fixture/runtime-mobile-bottom-nav.php
          cp reset.php /tmp/tmr-smart-fixture/reset.php
          cp app/WorkersAITranslation.php /tmp/tmr-smart-fixture/app/WorkersAITranslation.php
          cp app/workers-ai-card.php /tmp/tmr-smart-fixture/app/workers-ai-card.php
          cp scripts/workers-ai-request.php /tmp/tmr-smart-fixture/scripts/workers-ai-request.php
          mkdir -p /tmp/tmr-smart-fixture/assets/brand
          cp assets/brand/workers-ai-provider.css /tmp/tmr-smart-fixture/assets/brand/workers-ai-provider.css
          cp assets/brand/mark.svg /tmp/tmr-smart-fixture/assets/brand/mark.svg
          cp assets/brand/mark-maskable.svg /tmp/tmr-smart-fixture/assets/brand/mark-maskable.svg
          WORKERS_AI_TEST_ONLY=1 php /tmp/tmr-smart-fixture/runtime-workers-ai.php | grep WORKERS_AI_INSTALLED
          SMART_FORMAT_TEST_ONLY=1 php /tmp/tmr-smart-fixture/runtime-smart-format.php
          grep -Fq 'TMR_AI_LEARNING_CONTEXT_V1' /tmp/tmr-smart-fixture/app/SmartFormatting.php
          grep -Fq 'href="/ai-learning.php"' /tmp/tmr-smart-fixture/index.php
          test "$(grep -o 'href="/ai-learning.php"' /tmp/tmr-smart-fixture/index.php | wc -l)" -eq 1
          php tests/ai-learning-menu-order.php /tmp/tmr-smart-fixture/index.php
          php /tmp/tmr-smart-fixture/runtime-brand.php | grep BRAND_CANONICAL_APPLIED
          php tests/login-logo-cache-smoke.php /tmp/tmr-smart-fixture/login.php
          php -l /tmp/tmr-smart-fixture/reset.php
          php tests/reset-header-parity.php /tmp/tmr-smart-fixture/reset.php
          php /tmp/tmr-smart-fixture/runtime-mobile-bottom-nav.php | grep TMR_MOBILE_NAV_V1_APPLIED
          php -l /tmp/tmr-smart-fixture/index.php
          php -l /tmp/tmr-smart-fixture/reset.php
          php tests/mobile-bottom-nav-visibility.php /tmp/tmr-smart-fixture/index.php
          php tests/reset-mobile-bottom-nav-parity.php /tmp/tmr-smart-fixture/index.php /tmp/tmr-smart-fixture/reset.php
          reset_before="$(sha256sum /tmp/tmr-smart-fixture/reset.php | cut -d' ' -f1)"
          php /tmp/tmr-smart-fixture/runtime-mobile-bottom-nav.php | grep TMR_RESET_MOBILE_NAV_ALREADY_APPLIED
          test "$reset_before" = "$(sha256sum /tmp/tmr-smart-fixture/reset.php | cut -d' ' -f1)"
          mkdir -p /tmp/tmr-smart-fixture/tests
          cp runtime-ui-labels.php /tmp/tmr-smart-fixture/runtime-ui-labels.php
          cp tests/sidebar-canonical-icon-parity.php /tmp/tmr-smart-fixture/tests/sidebar-canonical-icon-parity.php
          php /tmp/tmr-smart-fixture/tests/sidebar-canonical-icon-parity.php

          php -l /tmp/tmr-smart-fixture/index.php
          php -l /tmp/tmr-smart-fixture/app/Repository.php
          php -l /tmp/tmr-smart-fixture/app/TranslationService.php
          php -l /tmp/tmr-smart-fixture/app/TelegramRouter.php
          WORKERS_AI_TEST_ONLY=1 php /tmp/tmr-smart-fixture/runtime-workers-ai.php | grep WORKERS_AI_ALREADY_APPLIED
          SMART_FORMAT_TEST_ONLY=1 php /tmp/tmr-smart-fixture/runtime-smart-format.php | grep SMART_FORMAT_ALREADY_APPLIED
      - name: Verify already-integrated formatter is recognized without rewriting
        run: |
          mkdir -p /tmp/tmr-ai-prewired/app
          cp runtime-ai-learning.php /tmp/tmr-ai-prewired/runtime-ai-learning.php
          cp app/AiLearningMemory.php /tmp/tmr-ai-prewired/app/AiLearningMemory.php
          cp app/SmartFormatting.php /tmp/tmr-ai-prewired/app/SmartFormatting.php
          test "$(sha256sum /tmp/tmr-ai-prewired/app/SmartFormatting.php | cut -c1-12)" = "8105afa847b5"
          hash_before="$(sha256sum /tmp/tmr-ai-prewired/app/SmartFormatting.php)"
          php /tmp/tmr-ai-prewired/runtime-ai-learning.php | grep -Fq 'AI_LEARNING_RUNTIME_READY_ALREADY_WIRED'
          test "$hash_before" = "$(sha256sum /tmp/tmr-ai-prewired/app/SmartFormatting.php)"
          printf '\\n' >> /tmp/tmr-ai-prewired/app/SmartFormatting.php
          hash_unknown="$(sha256sum /tmp/tmr-ai-prewired/app/SmartFormatting.php)"
          php /tmp/tmr-ai-prewired/runtime-ai-learning.php > /tmp/tmr-ai-unknown.out 2>&1
          grep -Fq 'AI_LEARNING_BASE_HASH_MISMATCH' /tmp/tmr-ai-unknown.out
          test "$hash_unknown" = "$(sha256sum /tmp/tmr-ai-prewired/app/SmartFormatting.php)"
      - name: Verify startup protects new translation provider
        run: |
          grep -Fq "TABLE_NAME=? AND COLUMN_NAME=?" scripts/translation-v2-safe-start.php
          grep -Fq "TRANSLATION_V2_MIGRATION_SKIPPED_NEW_PROVIDER_ACTIVE" scripts/translation-v2-safe-start.php
          grep -Fq "translation-migrate.php" scripts/translation-v2-safe-start.php
          ! grep -F "UPDATE router_rules SET translation_provider" scripts/translation-v2-safe-start.php
          grep -Fq 'GOOGLE_CLOUD_WORKERS_ENUM_PRESERVED' scripts/google-cloud-safe-start.php
          grep -Fq "'google_cloud','workers_ai'" scripts/google-cloud-safe-start.php
          grep -Fq 'GOOGLE_CLOUD_INSTALLER_SCHEMA_ANCHOR_CHANGED' scripts/google-cloud-safe-start.php
      - name: Assert PR39 routing with PR75 hardening
        run: |
          grep -Fq 'cardOwnsTranslation=SmartFormatting::shouldTranslateInsideCard' /tmp/tmr-smart-fixture/app/TelegramRouter.php
          grep -Fq 'translationRule' /tmp/tmr-smart-fixture/app/TelegramRouter.php
          grep -Fq 'translationFallback=Transform::translateDetailed' /tmp/tmr-smart-fixture/app/TelegramRouter.php
          grep -Fq 'providerUnavailable()' /tmp/tmr-smart-fixture/app/TelegramRouter.php
          grep -Fq 'TMR_SMART_FORMAT_ORIGINAL_FALLBACK' /tmp/tmr-smart-fixture/app/TelegramRouter.php
          grep -Fq 'ai_vip_card_partial' /tmp/tmr-smart-fixture/app/TelegramRouter.php
          grep -Fq 'ai_vip_card_contingency' /tmp/tmr-smart-fixture/app/TelegramRouter.php
          grep -Fq 'SMART_CARD_CONTINGENCY_UNAVAILABLE' /tmp/tmr-smart-fixture/app/TelegramRouter.php
          ! grep -Fq 'SMART_FORMAT_REQUIRED_UNAVAILABLE' /tmp/tmr-smart-fixture/app/TelegramRouter.php
          grep -Fq 'a tentativa foi interrompida' /tmp/tmr-smart-fixture/app/ErrorTranslator.php
          ! grep -Fq 'será reavaliada após a conexão ser restabelecida' /tmp/tmr-smart-fixture/app/ErrorTranslator.php
      - name: Assert Workers AI additive provider wiring
        run: |
          grep -Fq "value=\"workers_ai\"" /tmp/tmr-smart-fixture/index.php
          grep -Fq "WorkersAITranslation::attempt" /tmp/tmr-smart-fixture/app/TranslationService.php
          grep -Fq "'workers_ai'" /tmp/tmr-smart-fixture/app/Repository.php
          grep -Fq "workers-ai-card.php" /tmp/tmr-smart-fixture/index.php
          grep -Fq "WORKERS_AI_INSTALLED" runtime-workers-ai.php
          ! grep -R -F "cfut_" app scripts runtime-workers-ai.php assets tests || exit 1
      - name: Verify Railway integration source marker and cache-bust hook
        run: |
          grep -Fq 'integrations-v10.js?v=6' runtime-integrations-ui.php
          grep -Fq 'integrations-v10.js?v=7' runtime-brand.php
          grep -Fq 'integrations-v10.js?v=7' tests/sidebar-no-flash-nav-test.php
      - name: Verify approved integration card and badge alignment
        run: php tests/integration-badge-alignment-smoke.php
      - name: Verify activity status badge styling
        run: |
          grep -Fq '.saas-badge.Ignorada' assets/brand/activity-status-badges.css
          grep -Fq '.activity-badge.Ignorada' assets/brand/activity-status-badges.css
          grep -Fq '.saas-badge.Processando' assets/brand/activity-status-badges.css
          grep -Fq '.activity-badge.Processando' assets/brand/activity-status-badges.css
          grep -Fq 'color:#88BC47 !important;' assets/brand/activity-status-badges.css
          grep -Fq 'tmr-processing-blink' assets/brand/activity-status-badges.css
          grep -Fq 'prefers-reduced-motion:reduce' assets/brand/activity-status-badges.css
          grep -Fq 'activity-status-badges.css?v=4' runtime-brand.php
      - name: Verify configured rules pagination
        run: |
          grep -Fq '$rulesPerPage=6;$eventsPerPage=20;' index.php
          grep -Fq 'Repository::rules($rulesPage,$rulesPerPage)' index.php
          grep -Fq 'Repository::events($eventsPage,$eventsPerPage)' index.php
          grep -Fq "paginas(\$rulesPage,\$rulesTotal,'rules_page',\$rulesPerPage)" index.php
          grep -Fq "paginas(\$eventsPage,\$eventsTotal,'events_page',\$eventsPerPage)" index.php
          grep -Fq 'ceil($rulesTotal/6)' /tmp/tmr-smart-fixture/index.php
          grep -Fq 'Repository::rules($rulesPage,6)' /tmp/tmr-smart-fixture/index.php
          grep -Fq "paginas(\$rulesPage,\$rulesTotal,'rules_page',6)" /tmp/tmr-smart-fixture/index.php
          ! grep -Fq 'Repository::rules($rulesPage,5)' /tmp/tmr-smart-fixture/index.php
          grep -Fq 'Repository::events($eventsPage,20)' /tmp/tmr-smart-fixture/index.php
      - name: Render Workers AI provider UI in isolation
        run: |
          php -l tests/workers-ai-card-smoke.php
          php tests/workers-ai-card-smoke.php
          php tests/workers-ai-model-smoke.php
      - name: Verify translation provider and card fallback parity
        run: |
          php tests/smart-provider-routing-smoke.php
          printf '{}' | php scripts/smart-workers-isolated.php | grep -Fq 'INPUT_INVALID'
          SMART_WORKERS_CLASSIFIER_TEST=1 php scripts/smart-workers-isolated.php | grep -Fq 'WORKERS_VISION_ERROR_CLASSIFIER_TESTS_PASSED'
          SMART_WORKERS_JSON_TEST=1 php scripts/smart-workers-isolated.php | grep -Fq 'WORKERS_AI_JSON_EXTRACTION_TESTS_PASSED'
          python3 - <<'PY'
          from pathlib import Path
          code=Path('scripts/smart-workers-isolated.php').read_text()
          assert "foreach(['response','description'] as $textField)" in code
          assert 'EVIDÊNCIA EXTRAÍDA DA IMAGEM' in code
          assert "'image'=>$image" in code
          PY
          grep -Fq 'if($attempt===0){' scripts/smart-workers-isolated.php
          grep -Fq 'usleep(250000);continue;' scripts/smart-workers-isolated.php
          grep -Fq 'parsedVisionBet($result)' scripts/smart-workers-isolated.php
          grep -Fq 'probeVision($account,$token)' app/WorkersAITranslation.php
          grep -Fq 'MODEL_LICENSE_REQUIRED_5016' app/WorkersAITranslation.php
          grep -Fq '$checkOnly?12:2800' scripts/smart-workers-isolated.php
          grep -Fq '$timeouts=$checkOnly?[30,20]:[45,30]' scripts/smart-workers-isolated.php
          grep -Fq 'CURLOPT_CONNECTTIMEOUT=>min(8,$timeout)' scripts/smart-workers-isolated.php
          grep -Fq 'BUDGET_EXHAUSTED' scripts/smart-workers-isolated.php
      - name: Run isolated Gemini model-routing checks
        run: SMART_GEMINI_MODEL_ROUTE_TEST=1 php scripts/smart-gemini-isolated.php
      - name: Run mandatory contingency card checks
        run: php tests/contingency-card-smoke.php
      - name: Test doubles, multiples and Bet Builder classification
        run: php tests/multiple-bet-contingency-smoke.php
      - name: Run isolated card and text smoke checks
        run: php tests/smart-format-smoke.php
