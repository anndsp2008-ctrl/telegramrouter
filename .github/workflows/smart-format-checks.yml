name: Smart formatting isolated checks
on:
  pull_request:
    paths:
      - 'app/SmartFormatting.php'
      - 'app/VipCardRenderer.php'
      - 'runtime-smart-format.php'
      - 'runtime-workers-ai.php'
      - 'runtime-integrations-ui.php'
      - 'app/WorkersAITranslation.php'
      - 'app/workers-ai-card.php'
      - 'scripts/workers-ai-request.php'
      - 'scripts/smart-workers-isolated.php'
      - 'tests/smart-provider-routing-smoke.php'
      - 'assets/brand/workers-ai-provider.css'
      - 'tests/smart-format-smoke.php'
      - '.github/workflows/smart-format-checks.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP extensions and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-mbstring php-gd fonts-dejavu-core
      - name: Lint standalone modules
        run: |
          php -l app/SmartFormatting.php
          php -l app/PurePngVipCardRenderer.php
          php -l app/VipCardRenderer.php
          php -l runtime-smart-format.php
          php -l runtime-workers-ai.php
          php -l runtime-integrations-ui.php
          php -l app/WorkersAITranslation.php
          php -l app/workers-ai-card.php
          php -l scripts/workers-ai-request.php
          php -l scripts/smart-workers-isolated.php
          php -l tests/smart-provider-routing-smoke.php
      - name: Reconstruct sanitized baseline and patch it offline
        run: |
          mkdir -p /tmp/tmr-smart-fixture
          cat backup/production-source-2026-09-18.part*.b64 | tr -d '\r\n' | base64 -d | tar -xz -C /tmp/tmr-smart-fixture
          cp runtime-smart-format.php /tmp/tmr-smart-fixture/runtime-smart-format.php
          cp runtime-workers-ai.php /tmp/tmr-smart-fixture/runtime-workers-ai.php
          cp app/WorkersAITranslation.php /tmp/tmr-smart-fixture/app/WorkersAITranslation.php
          cp app/workers-ai-card.php /tmp/tmr-smart-fixture/app/workers-ai-card.php
          cp scripts/workers-ai-request.php /tmp/tmr-smart-fixture/scripts/workers-ai-request.php
          mkdir -p /tmp/tmr-smart-fixture/assets/brand
          cp assets/brand/workers-ai-provider.css /tmp/tmr-smart-fixture/assets/brand/workers-ai-provider.css
          WORKERS_AI_TEST_ONLY=1 php /tmp/tmr-smart-fixture/runtime-workers-ai.php | grep WORKERS_AI_INSTALLED
          SMART_FORMAT_TEST_ONLY=1 php /tmp/tmr-smart-fixture/runtime-smart-format.php
          php -l /tmp/tmr-smart-fixture/index.php
          php -l /tmp/tmr-smart-fixture/app/Repository.php
          php -l /tmp/tmr-smart-fixture/app/TranslationService.php
          php -l /tmp/tmr-smart-fixture/app/TelegramRouter.php
          WORKERS_AI_TEST_ONLY=1 php /tmp/tmr-smart-fixture/runtime-workers-ai.php | grep WORKERS_AI_ALREADY_APPLIED
          SMART_FORMAT_TEST_ONLY=1 php /tmp/tmr-smart-fixture/runtime-smart-format.php | grep SMART_FORMAT_ALREADY_APPLIED
      - name: Assert isolated single-pass routing patch
        run: |
          grep -Fq 'cardOwnsTranslation=SmartFormatting::shouldTranslateInsideCard' /tmp/tmr-smart-fixture/app/TelegramRouter.php
          grep -Fq 'translationRule' /tmp/tmr-smart-fixture/app/TelegramRouter.php
          grep -Fq 'SMART_FORMAT_REQUIRED_UNAVAILABLE' /tmp/tmr-smart-fixture/app/TelegramRouter.php
          grep -Fq 'TMR_SMART_FORMAT_REQUIRED_FAILED' /tmp/tmr-smart-fixture/app/TelegramRouter.php
          ! grep -Fq 'TMR_SMART_CARD_TRANSLATION_FALLBACK' /tmp/tmr-smart-fixture/app/TelegramRouter.php
          ! grep -Fq 'translationFallback=Transform::translateDetailed' /tmp/tmr-smart-fixture/app/TelegramRouter.php
      - name: Assert Workers AI additive provider wiring
        run: |
          grep -Fq "value=\"workers_ai\"" /tmp/tmr-smart-fixture/index.php
          grep -Fq "WorkersAITranslation::attempt" /tmp/tmr-smart-fixture/app/TranslationService.php
          grep -Fq "'workers_ai'" /tmp/tmr-smart-fixture/app/Repository.php
          grep -Fq "workers-ai-card.php" /tmp/tmr-smart-fixture/index.php
          grep -Fq "WORKERS_AI_INSTALLED" runtime-workers-ai.php
          ! grep -R -F "cfut_" app scripts runtime-workers-ai.php assets tests || exit 1
      - name: Render Workers AI provider UI in isolation
        run: |
          php -l tests/workers-ai-card-smoke.php
          php tests/workers-ai-card-smoke.php
      - name: Verify translation provider and card fallback parity
        run: |
          php tests/smart-provider-routing-smoke.php
          printf '{}' | php scripts/smart-workers-isolated.php | grep -Fq 'INPUT_INVALID'
      - name: Run isolated card and text smoke checks
        run: php tests/smart-format-smoke.php
