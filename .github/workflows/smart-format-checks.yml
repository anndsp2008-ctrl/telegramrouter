name: Smart formatting isolated checks
on:
  pull_request:
    paths:
      - 'app/SmartFormatting.php'
      - 'app/VipCardRenderer.php'
      - 'runtime-smart-format.php'
      - 'tests/smart-format-smoke.php'
      - '.github/workflows/smart-format-checks.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP extensions and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-mbstring php-gd fonts-dejavu-core
      - name: Lint standalone modules
        run: |
          php -l app/SmartFormatting.php
          php -l app/PurePngVipCardRenderer.php
          php -l app/VipCardRenderer.php
          php -l runtime-smart-format.php
      - name: Reconstruct sanitized baseline and patch it offline
        run: |
          mkdir -p /tmp/tmr-smart-fixture
          cat backup/production-source-2026-09-18.part*.b64 | tr -d '\r\n' | base64 -d | tar -xz -C /tmp/tmr-smart-fixture
          cp runtime-smart-format.php /tmp/tmr-smart-fixture/runtime-smart-format.php
          SMART_FORMAT_TEST_ONLY=1 php /tmp/tmr-smart-fixture/runtime-smart-format.php
          php -l /tmp/tmr-smart-fixture/index.php
          php -l /tmp/tmr-smart-fixture/app/TelegramRouter.php
          SMART_FORMAT_TEST_ONLY=1 php /tmp/tmr-smart-fixture/runtime-smart-format.php | grep SMART_FORMAT_ALREADY_APPLIED
      - name: Inspect sanitized baseline translation routing (temporary diagnostic)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('/tmp/tmr-smart-fixture/app/Transform.php')
          if t.exists():
              for n,line in enumerate(t.read_text().splitlines(),1):
                  if n<=250: print(f'TRANSFORM {n}: {line}')
          r=Path('/tmp/tmr-smart-fixture/app/TelegramRouter.php')
          if r.exists():
              lines=r.read_text().splitlines()
              picks=[i for i,line in enumerate(lines) if any(x in line for x in
                  ['Transform::','translation_enabled','translation_target','sendSmartOrOriginal',
                   'sendMediaWithSafeCaption(','deliveryMethod','translation_mode'])]
              keep=set()
              for i in picks:
                  keep.update(range(max(0,i-5),min(len(lines),i+9)))
              for i in sorted(keep.union(range(87,117))):
                  if i<800: print(f'ROUTER {i+1}: {lines[i]}')
          q=Path('/tmp/tmr-smart-fixture/app/TranslationService.php')
          if q.exists():
              lines=q.read_text().splitlines()
              picks=[i for i,line in enumerate(lines) if any(x in line for x in
                  ['function translate(', 'translation_output', 'original_preserved',
                   'return [', 'translation_mode'])]
              keep=set()
              for i in picks:
                  keep.update(range(max(0,i-3),min(len(lines),i+9)))
              for i in sorted(keep):
                  if i<800: print(f'SERVICE {i+1}: {lines[i]}')
          PY
      - name: Run isolated card and text smoke checks
        run: php tests/smart-format-smoke.php
